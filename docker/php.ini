; Limiti per le foto scattate col telefono (danni al rientro, foto dei prodotti).
; Vale anche in produzione: va riportato nella configurazione PHP del server.
upload_max_filesize = 25M
post_max_size = 100M
max_file_uploads = 20
; Ridurre una foto da 12 megapixel con GD occupa circa 200 MB.
memory_limit = 512M
